server:
  port: ${SERVER_PORT:8082}

spring:
  application.name: servicio-notificaciones
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: grupo-notificaciones
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties: 
        spring:
          deserializer:
            key:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
            value:
              delegate:
                class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema:
          registry:
            url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
        specific:
          avro:
            reader: true

clients:
  inventario:
    url: ${CLIENTS_INVENTARIO_URL:http://localhost:8084}  

kafka:
  topic:
    pedidos: pedidos-avro-topic
    pedidos-cancelados: pedidos-cancelados-avro-topic
