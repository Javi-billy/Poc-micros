services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - kafka  

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "/bin/ollama serve & sleep 5 && ollama pull llama3.2 && wait"]

# ==========================================
# MICROSERVICIOS
# ==========================================
  ms-inventario:
    build: ./ms-inventario
    container_name: ms-inventario
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084

  servicio-pedidos:
    build: ./servicio-pedidos
    container_name: servicio-pedidos
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry

  ms-pedidos:
    build: ./ms-pedidos
    container_name: ms-pedidos
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      CLIENTS_INVENTARIO_URL: http://ms-inventario:8084
      CLIENTS_SERVICIO_PEDIDOS_URL: http://servicio-pedidos:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
      - ms-inventario
      - servicio-pedidos

  servicio-notificaciones:
    build: ./servicio-notificaciones
    deploy:
      replicas: 2 # Levanta tus 2 instancias automáticamente
    environment:
      SERVER_PORT: 8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLIENTS_INVENTARIO_URL: http://ms-inventario:8084
    depends_on:
      - kafka
      - schema-registry
      - ms-inventario

  ms-api-gateway:
    build: ./ms-api-gateway
    container_name: ms-api-gateway
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      MS_PEDIDOS_URL: http://ms-pedidos:8083
      MS_INVENTARIO_URL: http://ms-inventario:8084
      SERVICIO_PEDIDOS_URL: http://servicio-pedidos:8081
      ASISTENTE_IA_URL: http://ms-asistente-ia:8086
    depends_on:
      - ms-pedidos
      - ms-inventario
      - servicio-pedidos
      - ms-asistente-ia
  
  ms-asistente-ia:
    build: ./ms-asistente-ia
    container_name: ms-asistente-ia
    ports:
      - "8086:8086"
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      CLIENTS_INVENTARIO_URL: http://ms-inventario:8084
      CLIENTS_PEDIDOS_URL: http://ms-pedidos:8083
    depends_on:
      - ollama
      - ms-pedidos
      - ms-inventario

volumes:
  ollama_data:    