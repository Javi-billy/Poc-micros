server:
  port: ${SERVER_PORT:8083}

clients:
  servicio-pedidos:
    url: ${CLIENTS_SERVICIO_PEDIDOS_URL:http://localhost:8081}
  inventario:
    url: ${CLIENTS_INVENTARIO_URL:http://localhost:8084}

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: pedidos-saga-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.example.pedidos.infrastructure.adapter.in.messaging.OrderSagaResponseEvent
        spring.json.use.type.headers: false

resilience4j:
  circuitbreaker:
    instances:
      ms-inventario:
        slidingWindowSize: 4
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      servicio-pedidos:
        slidingWindowSize: 4
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
